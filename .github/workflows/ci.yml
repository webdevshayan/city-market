name: CI

# Production discipline: every run happens on main only — tests gate the
# Vercel production deploys, and production never takes code from anywhere
# else. Pull requests get no runs by design. workflow_dispatch exists so a
# run can be retried manually (e.g. redeploy after fixing a Vercel hiccup).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  server:
    name: Go server — vet, Halal-math tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (financial engine)
        run: go test ./... -v
      - name: Build
        run: go build -v ./...

  web:
    name: Tailwind — one minified stylesheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build stylesheet
        run: |
          cd web
          npm ci
          npx tailwindcss -c tailwind.config.js -i input.css -o site/static/styles.css --minify
      - name: Fail if the stylesheet is missing or trivially small
        run: |
          size=$(wc -c < web/site/static/styles.css)
          echo "styles.css bytes: ${size}"
          [ "${size}" -gt 500 ] || { echo "::error::styles.css is suspiciously small (${size} bytes)"; exit 1; }
      - name: Fail on stylesheet drift (committed CSS must match templates)
        run: |
          if ! git diff --exit-code -- web/site/static/styles.css; then
            echo "::error::web/site/static/styles.css is stale — run scripts/build-css.sh and commit the result"
            exit 1
          fi
      - name: Upload stylesheet (artifact, 1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: styles-css
          path: web/site/static/styles.css
          retention-days: 1
          if-no-files-found: error

  webapp:
    name: Web app — vet, test (standalone Go module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  flutter:
    name: Flutter — analyze + test core and the four apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - name: Pub get, analyze, test — core and every app
        run: |
          for pkg in core citizen shop rider admin; do
            echo "::group::$pkg"
            (cd "apps/$pkg" && flutter pub get && flutter analyze && flutter test) || exit 1
            echo "::endgroup::"
          done

  # Storage policy: no permanent heavy files. Uploads live for 1 day
  # Production deploys: both Vercel projects ship from main only, and only
  # after every test job is green. Each deploy links by org/project ID from
  # secrets (no committed .vercel directory) and lets Vercel build remotely
  # with the Go framework preset each vercel.json already declares. While
  # the secrets are unset the jobs skip with a notice — the pipeline stays
  # green from the very first run.
  deploy-server:
    name: Deploy — server (API) to Vercel production
    needs: [server, web, webapp, flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — skip until the Vercel secrets exist
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID_SERVER }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set yet (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_SERVER) — production deploy skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to production
        if: steps.guard.outputs.skip != 'true'
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  deploy-web:
    name: Deploy — web app to Vercel production
    needs: [server, web, webapp, flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — skip until the Vercel secrets exist
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID_WEB }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set yet (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_WEB) — production deploy skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to production
        if: steps.guard.outputs.skip != 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  # (retention-days: 1) and this job force-deletes anything older, so the
  # repository never accumulates heavy artifacts.
  cleanup:
    name: Storage cleanup — delete stale artifacts
    needs: [server, web, webapp, flutter]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          cutoff=$(( $(date -u +%s) - 86400 ))
          gh api "repos/${repo}/actions/artifacts" --paginate \
            --jq '.artifacts[] | [.id, .created_at] | @tsv' |
          while IFS=$'\t' read -r id created; do
            [ -n "${id}" ] || continue
            ts=$(date -u -d "${created}" +%s)
            if [ "${ts}" -lt "${cutoff}" ]; then
              echo "deleting artifact ${id} (created ${created})"
              gh api -X DELETE "repos/${repo}/actions/artifacts/${id}"
            fi
          done
          echo "cleanup pass complete"
