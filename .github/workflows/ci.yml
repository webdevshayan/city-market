name: CI

# Production discipline: every run happens on main only — tests gate the
# Vercel production deploys, and production never takes code from anywhere
# else. Pull requests get no runs by design. Jobs are path-scoped: a push
# that touches only one tree (server/, web/, apps/) builds, tests and
# deploys that tree alone. workflow_dispatch skips the diff and runs
# everything — the manual "redeploy after a Vercel hiccup" escape hatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Path scoping: the jobs below run only when their own tree changed in
  # this push. The diff is github.event.before → HEAD, so a batch push is
  # judged as a whole. An edit to ci.yml itself reruns everything (the CI
  # code changed), and workflow_dispatch has no diff base — both are the
  # "run all" escape hatch. success() in each if keeps the default needs
  # gate: a failed (or skipped) dependency still skips its dependent.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # github.event.before can sit many commits back
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          all() {
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "apps=true" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no push diff base (event: ${EVENT}) — running every job"
            all
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "changed paths in this push:"
          echo "$changed"
          if grep -q '^\.github/workflows/ci\.yml' <<< "$changed"; then
            echo "::notice::ci.yml itself changed — running every job"
            all
            exit 0
          fi
          if grep -q '^server/' <<< "$changed"; then echo "server=true" >> "$GITHUB_OUTPUT"; else echo "server=false" >> "$GITHUB_OUTPUT"; fi
          if grep -q '^web/' <<< "$changed"; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          if grep -q '^apps/' <<< "$changed"; then echo "apps=true" >> "$GITHUB_OUTPUT"; else echo "apps=false" >> "$GITHUB_OUTPUT"; fi

  server:
    name: Go server — vet, Halal-math tests, build
    needs: changes
    if: success() && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (financial engine)
        run: go test ./... -v
      - name: Build
        run: go build -v ./...

  web:
    name: Tailwind — one minified stylesheet
    needs: changes
    if: success() && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build stylesheet
        run: |
          cd web
          npm ci
          npx tailwindcss -c tailwind.config.js -i input.css -o site/static/styles.css --minify
      - name: Fail if the stylesheet is missing or trivially small
        run: |
          size=$(wc -c < web/site/static/styles.css)
          echo "styles.css bytes: ${size}"
          [ "${size}" -gt 500 ] || { echo "::error::styles.css is suspiciously small (${size} bytes)"; exit 1; }
      - name: Fail on stylesheet drift (committed CSS must match templates)
        run: |
          if ! git diff --exit-code -- web/site/static/styles.css; then
            echo "::error::web/site/static/styles.css is stale — run scripts/build-css.sh and commit the result"
            exit 1
          fi
      - name: Upload stylesheet (artifact, 1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: styles-css
          path: web/site/static/styles.css
          retention-days: 1
          if-no-files-found: error

  webapp:
    name: Web app — vet, test (standalone Go module)
    needs: changes
    if: success() && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  flutter:
    name: Flutter — analyze + test core and the four apps
    needs: changes
    if: success() && needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - name: Pub get, analyze, test — core and every app
        run: |
          for pkg in core citizen shop rider admin; do
            echo "::group::$pkg"
            (cd "apps/$pkg" && flutter pub get && flutter analyze && flutter test) || exit 1
            echo "::endgroup::"
          done

  # Production deploys: each Vercel project ships from main only, and only
  # after its own tree's tests are green on a push that touched that tree
  # (the changes job scopes them; an Android-only push deploys neither).
  # Each deploy links by org/project ID (repo
  # variables or secrets — no committed .vercel directory) and lets Vercel
  # build remotely with the Go framework preset each vercel.json already
  # declares; each job uses its own Vercel token. Credentials are read as
  # vars.NAME || secrets.NAME, so either the Variables or the Secrets tab
  # works. While credentials are unset the jobs skip with a notice — the
  # pipeline stays green from the very first run.
  deploy-server:
    name: Deploy — server (API) to Vercel production
    needs: [changes, server]
    if: success() && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — skip until the Vercel credentials exist
        id: guard
        env:
          V_TOKEN: ${{ vars.VERCEL_TOKEN_FOR_CM_SERVER || secrets.VERCEL_TOKEN_FOR_CM_SERVER }}
          V_ORG: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          V_PID: ${{ vars.VERCEL_PROJECT_ID_SERVER || secrets.VERCEL_PROJECT_ID_SERVER }}
        run: |
          missing=""
          if [ -z "$V_TOKEN" ]; then missing="$missing VERCEL_TOKEN_FOR_CM_SERVER"; fi
          if [ -z "$V_ORG" ]; then missing="$missing VERCEL_ORG_ID"; fi
          if [ -z "$V_PID" ]; then missing="$missing VERCEL_PROJECT_ID_SERVER"; fi
          if [ -n "$missing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing Vercel credentials (repo variables or secrets):$missing — production deploy skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to production
        if: steps.guard.outputs.skip != 'true'
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN_FOR_CM_SERVER || secrets.VERCEL_TOKEN_FOR_CM_SERVER }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_SERVER || secrets.VERCEL_PROJECT_ID_SERVER }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  deploy-web:
    name: Deploy — web app to Vercel production
    needs: [changes, web, webapp]
    if: success() && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — skip until the Vercel credentials exist
        id: guard
        env:
          V_TOKEN: ${{ vars.VERCEL_TOKEN_FOR_CM_WEB || secrets.VERCEL_TOKEN_FOR_CM_WEB }}
          V_ORG: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          V_PID: ${{ vars.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          missing=""
          if [ -z "$V_TOKEN" ]; then missing="$missing VERCEL_TOKEN_FOR_CM_WEB"; fi
          if [ -z "$V_ORG" ]; then missing="$missing VERCEL_ORG_ID"; fi
          if [ -z "$V_PID" ]; then missing="$missing VERCEL_PROJECT_ID_WEB"; fi
          if [ -n "$missing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing Vercel credentials (repo variables or secrets):$missing — production deploy skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to production
        if: steps.guard.outputs.skip != 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN_FOR_CM_WEB || secrets.VERCEL_TOKEN_FOR_CM_WEB }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  # Storage policy: no permanent heavy files. Uploads live for 1 day
  # (retention-days: 1) and this job force-deletes anything older, so the
  # repository never accumulates heavy artifacts.
  cleanup:
    name: Storage cleanup — delete stale artifacts
    needs: [server, web, webapp, flutter]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          cutoff=$(( $(date -u +%s) - 86400 ))
          gh api "repos/${repo}/actions/artifacts" --paginate \
            --jq '.artifacts[] | [.id, .created_at] | @tsv' |
          while IFS=$'\t' read -r id created; do
            [ -n "${id}" ] || continue
            ts=$(date -u -d "${created}" +%s)
            if [ "${ts}" -lt "${cutoff}" ]; then
              echo "deleting artifact ${id} (created ${created})"
              gh api -X DELETE "repos/${repo}/actions/artifacts/${id}"
            fi
          done
          echo "cleanup pass complete"
